<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dev Finance$</title>
</head>

<body>
  <header>
    <h1>Dev Finance$</h1>
  </header>
  <main>

    <section id="balance">
      <div class="card">
        <h2>Entradas</h2>
        <span>R$ 5.000,00</span>
      </div>
      <div class="card">
        <h2>Saídas</h2>
        <span>R$ 5.000,00</span>
      </div>
      <div class="card">
        <h2>Total</h2>
        <span>R$ 5.000,00</span>
      </div>
    </section>

    <section id="transactions">
      <div>
        <input type="text" placeholder="Buscar transação">
        <button>+ Nova Transação</button>
      </div>
      <table>
        <thead>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Data</th>
          <th>Ações</th>
        </thead>
        <tbody>
          <td>Conta de água</td>
          <td>R$ 75,00</td>
          <td>15/05/2024</td>
          <td>
            editar
            excluir
          </td>
        </tbody>
      </table>
    </section>

  </main>

  <footer>
    <p>DevFinance$</p>
  </footer>

  <script src="./sccript.js"></script>
</body>

</html>
