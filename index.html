<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Dev Finance$</title>
</head>

<body>
  <header>
    <h1>Dev Finance$</h1>
  </header>
  <main>

    <section id="balance" class="container">
      <div class="card">
        <h2>Entradas</h2>
        <span>R$ 5.000,00</span>
      </div>
      <div class="card">
        <h2>Saídas</h2>
        <span>R$ 5.000,00</span>
      </div>
      <div class="card">
        <h2>Total</h2>
        <span>R$ 5.000,00</span>
      </div>
    </section>

    <section id="transactions" class="container">

      <div class="handle-transaction">
        <input type="text" placeholder="Buscar transação" class="search">
        <button class="new">+ Nova Transação</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Conta de água</td>
            <td>R$ 75,00</td>
            <td>15/05/2024</td>
            <td>
              editar
              excluir
            </td>
          </tr>
          <tr>
            <td>Conta de água</td>
            <td>R$ 75,00</td>
            <td>15/05/2024</td>
            <td>
              editar
              excluir
            </td>
          </tr>
          <tr>
            <td>Conta de água</td>
            <td>R$ 75,00</td>
            <td>15/05/2024</td>
            <td>
              editar
              excluir
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>DevFinance$</p>
  </footer>

  <div class="modal">
    <div class="modal-content">
      <h2>Adicionar transação</h2>
      <form>
        <input type="text" placeholder="Descrição...">
        <input type="text" placeholder="R$ 0,00">
        <input type="date" placeholder="dd/mm/aaaa">
        <div class="modal-btn-area">
          <button class="cancel">Cancelar</button>
          <button class="save">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./sccript.js"></script>
</body>

</html>
