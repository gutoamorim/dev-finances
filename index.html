<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Dev Finance$</title>
</head>

<body>
  <header>
    <img src="./assets/images/logo.svg" alt="logo dev finances" />
  </header>
  <main>

    <section id="balance" class="container">
      <div class="card">
        <h2 class="card-title">
          Entradas
          <i class="fa-regular fa-circle-up"></i>
        </h2>
        <span id="income-card">
        </span>
      </div>
      <div class="card">
        <h2 class="card-title">
          Saídas
          <i class="fa-regular fa-circle-down"></i>
        </h2>
        <span id="expense-card"></span>
      </div>
      <div class="card">
        <h2>
          Total
          <i class="fa-solid fa-dollar-sign"></i>
        </h2>
        <span id="total-card"></span>
      </div>
    </section>

    <section id="transactions" class="container">

      <div class="handle-transaction">
        <input type="text" placeholder="Buscar transação" class="search" id="filter-input">
        <button class="new" id="open-modal-btn">+ Nova Transação</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Valor</th>
              <th>Data</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>DevFinance$</p>
  </footer>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2></h2>
      <form>
        <input type="hidden" id="transaction-id">
        <div class="types">
          <label for="income" class="type-input">
            <input type="radio" name="type" id="income">
            Receita
          </label>
          <label for="expense" class="type-input">
            <input type="radio" name="type" id="expense">
            Despesa
          </label>
        </div>
        <input type="text" placeholder="Descrição..." id="description">
        <input type="text" placeholder="R$ 0,00" id="amount">
        <input type="date" placeholder="dd/mm/aaaa" id="date">
        <div class="modal-btn-area">
          <button class="cancel" id="close-btn">Cancelar</button>
          <button class="save" id="save-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./sccript.js"></script>
</body>

</html>
